name: Tests

# THE MERGE GATE. Runs on every PR and every push to master. Without one,
# "N passed" in a PR body attests to the author's laptop, not to the merged
# state — the proxy-reading class one level up from the code.
#
# Deliberately OFFLINE and secret-free: pytest and the doc guards read only
# committed files, so this needs no network and no token. It stays fast and
# cannot flake on an upstream outage — a merge gate that goes red for reasons
# unrelated to the change is a gate people learn to ignore.
#
# If the project later adds a scheduled data-refresh workflow, give THAT its
# own pytest step too: this gates the CHANGE, that one gates the DATA PUBLISH.
# Two different questions, two runs.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # tests/test_loaded_path.py reads git history

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Bans line-number citations and fails on an unresolvable section pointer.
      - name: Check doc citations
        run: python scripts/check_doc_citations.py

      # The decisions log's two write-time rules, enforced where a row is written:
      # a new row names a test that exists or is tagged [unverifiable]; a row that
      # supersedes an earlier one has that row marked in place.
      - name: Check decisions log
        run: python scripts/check_decisions_log.py
