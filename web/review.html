<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<style>
:root { --bg:#fbfaf7; --panel:#fff; --ink:#1f2328; --soft:#6b7280; --line:#e2dfd8; --accent:#2f6f5e; --warn:#a15c00; --ok:#2f6f5e; --hover:#f0eee8; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16181b; --panel:#1e2125; --ink:#e6e6e3; --soft:#9aa0a6; --line:#33373d; --accent:#7fc7b1; --warn:#e0a458; --ok:#7fc7b1; --hover:#262a2f; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; display:grid; grid-template:auto 1fr / 300px 1fr; height:100vh; }
header { grid-column:1 / 3; display:flex; gap:12px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
header #counts { flex:1; color:var(--soft); font-size:13px; }
nav { overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
nav input { width:calc(100% - 16px); margin:8px; }
nav .t { padding:6px 12px; cursor:pointer; display:flex; gap:8px; border-left:3px solid transparent; }
nav .t:hover { background:var(--hover); }
nav .t.on { border-left-color:var(--accent); background:var(--hover); }
nav .t .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
nav .t .ct { color:var(--soft); font-size:12px; white-space:nowrap; }
main { overflow:auto; padding:16px 22px 80px; }
h2 { margin:0 0 4px; font-size:19px; }
h3 { margin:22px 0 6px; font-size:13px; color:var(--soft); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.bar { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:10px 0; }
.card.done { border-color:var(--ok); }
.later > .tx, .card.later > .head b, nav .t.later .nm { opacity:.6; }
.card .head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
.card .head b { font-size:15px; }
.row { display:flex; gap:10px; padding:6px 4px; border-top:1px solid var(--line); align-items:flex-start; }
.row:first-of-type { border-top:0; }
.row .n { color:var(--soft); font-size:12px; min-width:52px; padding-top:2px; font-variant-numeric:tabular-nums; }
.row .tx { flex:1; white-space:pre-wrap; overflow-wrap:anywhere; }
.row .acts { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:420px; }
.row .was { display:block; color:var(--soft); font-size:12px; }
.badge { font-size:11px; padding:1px 6px; border-radius:9px; border:1px solid var(--line); color:var(--soft); white-space:nowrap; }
.badge.ok { color:var(--ok); border-color:var(--ok); }
.badge.warn { color:var(--warn); border-color:var(--warn); }
button, input, textarea { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:3px 9px; }
button { cursor:pointer; font-size:13px; }
button:hover { background:var(--hover); }
button.main { border-color:var(--accent); color:var(--accent); }
#save { font-size:15px; font-weight:600; padding:6px 18px; }
#save.due { background:var(--accent); border-color:var(--accent); color:#fff; }
dialog { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; width:min(680px, 92vw); padding:16px; }
dialog::backdrop { background:rgba(0,0,0,.4); }
dialog textarea, dialog input { width:100%; }
dialog textarea { min-height:190px; }
dialog .opts { max-height:50vh; overflow:auto; margin-top:8px; }
dialog .opt { padding:6px 8px; cursor:pointer; border-radius:6px; display:flex; gap:8px; }
dialog .opt:hover, dialog .opt.on { background:var(--hover); }
dialog .hint { color:var(--soft); font-size:13px; margin:6px 0; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--warn); color:#fff; padding:8px 14px; border-radius:8px; display:none; max-width:80vw; }
</style>
</head>
<body>
<header>
  <b id="doc"></b>
  <span id="counts"></span>
  <button id="undo" title="Take back the latest decision (u)">Undo</button>
  <button id="save" title="Commit your decisions to the private repository and push them"></button>
</header>
<nav>
  <input id="filter" placeholder="Filter themes ( / )">
  <div id="themes"></div>
</nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
"use strict";
// Item text is only ever set through textContent / value, never as HTML.
let S = null, current = null, justSplit = [], hints = { items: {}, groups: {}, new: [] };
const NONE = "", DROPPED = "~dropped", LATER = "~later", NEW = "~new", NEARBY = 5;
const $ = (s) => document.querySelector(s);

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "on") for (const [ev, f] of Object.entries(v)) e.addEventListener(ev, f);
    else if (k === "class") e.className = v;
    else e[k] = v;
  }
  e.append(...kids.filter((k) => k !== null && k !== undefined));
  return e;
}
const btn = (label, f, cls = "") => el("button", { class: cls, on: { click: f } }, label);
const badge = (label, cls = "") => el("span", { class: "badge " + cls }, label);

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.style.display = "none"), 6000);
}

async function load() {
  const r = await fetch("/api/state");
  const j = await r.json();
  if (!r.ok) return toast(j.error);
  S = j;
  render();
  if (S.counts.in_no_theme) suggest();
}

// Asked for after the page is drawn: the first answer after a split embeds the new parts, which takes a moment.
async function suggest() {
  const r = await fetch("/api/suggest");
  if (!r.ok) return;
  hints = await r.json();
  renderMain();
}

function hintBar(kind, id) {
  const tids = (hints[kind][id] || []).filter((tid) => S.themes.some((t) => t.id === tid));
  if (!tids.length) return null;
  return el("div", { class: "bar" }, el("span", { class: "badge" }, "nearest themes"),
    ...tids.map((tid) => btn("→ " + themeName(tid).slice(0, 40), () => send({ op: "assign", [kind === "items" ? "item" : "group"]: kind === "items" ? S.items[id].n : id, theme: tid }))));
}

async function send(entry) {
  const r = await fetch("/api/log", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(entry) });
  const j = await r.json();
  if (!r.ok) { toast(j.error); return null; }
  await load();
  return j.logged;
}

const items = () => Object.values(S.items);
const themeName = (tid) => { const t = S.themes.find((t) => t.id === tid); return t ? t.name : "no theme"; };
const groupItems = (gid) => S.groups[gid].items.map((n) => S.items[String(n)]);
const themeItems = (t) => t.items.map((n) => S.items[String(n)]);
const themeSize = (t) => t.items.length + t.groups.reduce((a, gid) => a + S.groups[gid].items.length, 0);
const themeLater = (tid) => S.themes.some((t) => t.id === tid && t.later);
const alone = (it) => it.where === "undecided" || it.where === "kept";

function sections() {
  const rows = S.themes.map((t) => ({ id: t.id, name: t.name, size: themeSize(t), done: t.confirmed, later: t.later })).sort((a, b) => a.later - b.later || b.size - a.size);
  const looseItems = items().filter((it) => alone(it) && it.theme === null).length;
  const looseGroups = Object.values(S.groups).filter((g) => g.theme === null).length;
  rows.push({ id: NONE, name: "In no theme", size: looseItems + looseGroups });
  rows.push({ id: LATER, name: "Later", size: S.counts.later });
  rows.push({ id: DROPPED, name: "Dropped", size: S.counts.dropped });
  return rows;
}

function render() {
  const c = S.counts;
  $("#doc").textContent = S.doc;
  $("#save").textContent = S.unsaved ? "Save" : S.unsaved === false ? "Saved" : "Save (no repository)";
  $("#save").className = S.unsaved ? "due" : "";
  $("#save").disabled = !S.unsaved;
  $("#counts").textContent = `${c.undecided} undecided · ${c.in_groups} in ${c.groups} groups (${c.groups_confirmed} confirmed) · ${c.kept} kept · ${c.later} later · ${c.dropped} dropped · ${c.broken} split into ${c.parts} · ${c.themes} themes (${c.themes_confirmed} confirmed)`;
  const rows = sections();
  if (current === null || !rows.some((r) => r.id === current)) current = rows[0].id;
  const q = $("#filter").value.trim().toLowerCase();
  const list = $("#themes");
  list.replaceChildren(...rows.filter((r) => !q || r.name.toLowerCase().includes(q) || r.id === current).map((r) =>
    el("div", { class: "t" + (r.id === current ? " on" : "") + (r.later ? " later" : ""), on: { click: () => { current = r.id; render(); $("#main").scrollTop = 0; } } },
      el("span", { class: "nm", title: r.name }, r.name), el("span", { class: "ct" }, (r.later ? "later · " : "") + (r.done ? "✓ " : "") + r.size))));
  const on = list.querySelector(".on");
  if (on) on.scrollIntoView({ block: "nearest" });
  renderMain();
}

function itemRow(it, inGroup) {
  const acts = el("div", { class: "acts" });
  if (it.where === "dropped") {
    acts.append(btn("Restore", () => send({ op: "unassign", item: it.n })));
  } else {
    acts.append(btn("Split", () => splitDialog(it)));
    if (inGroup) acts.append(btn("Pull out", () => send({ op: "unassign", item: it.n })));
    else if (it.where === "kept") {
      if (!it.confirmed) acts.append(btn("Confirm", () => send({ op: "confirm", item: it.n }), "main"));
      acts.append(btn("Unkeep", () => send({ op: "unassign", item: it.n })));
    } else acts.append(btn("Keep", () => send({ op: "keep", item: it.n })));
    if (!inGroup) acts.append(btn("Edit line", () => { const text = prompt("The line in the new list:", it.draft || it.text); if (text && text !== (it.draft || it.text)) send({ op: "draft", item: it.n, text }); }));
    if (!inGroup) acts.append(btn("Theme…", () => pickTheme("Put this item in which theme?", (tid) => send({ op: "assign", item: it.n, theme: tid }), null, { items: [it.n] })));
    acts.append(btn("Group…", () => pickGroup(it)));
    acts.append(btn("Similar", () => similar(it)));
    acts.append(btn("Nearby", () => nearby(it)));
    if (!inGroup && !themeLater(it.theme)) acts.append(btn(it.later ? "Not later" : "Later", () => send({ op: "later", item: it.n, on: !it.later })));
    acts.append(btn("Drop", () => { const reason = prompt("Why drop it?"); if (reason) send({ op: "drop", item: it.n, reason }); }));
  }
  const later = it.later || (!inGroup && it.where === "kept" && themeLater(it.theme));
  return el("div", { class: "row" + (later ? " later" : "") },
    el("span", { class: "n" }, "#" + it.n),
    el("span", { class: "tx" }, it.draft || it.text,
      it.where === "kept" ? badge(it.confirmed ? "kept ✓" : "kept", "ok") : null,
      later ? badge("later") : null,
      it.where === "dropped" ? badge(it.reason, "warn") : null,
      it.draft ? el("span", { class: "was" }, "was: " + it.text) : null,
      !inGroup && it.theme === null && alone(it) ? hintBar("items", String(it.n)) : null),
    acts);
}

// A theme the server thinks some of what is in no theme could form; shown only while two or more of its members still are.
function candidateCard(c) {
  const ns = c.items.filter((n) => S.items[String(n)] && alone(S.items[String(n)]) && S.items[String(n)].theme === null);
  const gids = c.groups.filter((gid) => S.groups[gid] && S.groups[gid].theme === null);
  if (ns.length + gids.length < 2) return null;
  const label = (m) => m in S.groups ? S.groups[m].draft || S.groups[m].name : S.items[String(m)].text;
  const first = [c.named_after, ...gids, ...ns].find((m) => gids.includes(m) || ns.includes(m));
  return el("div", { class: "card" },
    el("div", { class: "bar" }, btn("Make theme", () => { const name = prompt("Name for the new theme:", label(first).slice(0, 80)); if (name) send({ op: "theme", name, groups: gids, items: ns }); }, "main")),
    ...gids.map((gid) => el("div", { class: "row" }, el("span", { class: "n" }, gid), el("span", { class: "tx" }, label(gid), badge(S.groups[gid].items.length + " items")))),
    ...ns.map((n) => el("div", { class: "row" }, el("span", { class: "n" }, "#" + n), el("span", { class: "tx" }, label(n)))));
}

function groupCard(gid) {
  const g = S.groups[gid], later = g.later || themeLater(g.theme);
  const head = el("div", { class: "head" }, el("b", {}, g.draft || g.name), badge(gid),
    g.confirmed ? badge("confirmed", "ok") : null, later ? badge("later") : null, g.flag ? badge("flag: " + g.flag, "warn") : null);
  const bar = el("div", { class: "bar" },
    g.confirmed ? null : btn("Confirm group", () => send({ op: "confirm", group: gid }), "main"),
    btn("Edit line", () => { const text = prompt("The line in the new list:", g.draft || g.name); if (text) send({ op: "draft", group: gid, text }); }),
    btn("Rename", () => { const name = prompt("Group name:", g.name); if (name) send({ op: "rename", group: gid, name }); }),
    btn("Theme…", () => pickTheme("Put this group in which theme?", (tid) => send({ op: "assign", group: gid, theme: tid }), null, { groups: [gid] })),
    themeLater(g.theme) ? null : btn(g.later ? "Not later" : "Later", () => send({ op: "later", group: gid, on: !g.later })));
  return el("div", { class: "card" + (g.confirmed ? " done" : "") + (later ? " later" : "") }, head, bar, g.theme === null ? hintBar("groups", gid) : null, ...groupItems(gid).map((it) => itemRow(it, true)));
}

function renderMain() {
  const main = $("#main");
  const out = [];
  const waiting = justSplit.map((n) => S.items[String(n)]).filter((it) => it && it.where === "undecided" && it.theme === null);
  if (waiting.length) {
    out.push(el("h3", {}, "Just split, not placed yet"), el("div", { class: "card" }, ...waiting.map((it) => {
      const row = itemRow(it, false);
      if (![NONE, DROPPED, LATER].includes(current))
        row.querySelector(".acts").prepend(btn("Put here", () => send({ op: "assign", item: it.n, theme: current }), "main"));
      return row;
    })));
  }
  if (current === DROPPED) {
    out.push(el("h2", {}, "Dropped"), el("div", { class: "card" }, ...items().filter((it) => it.where === "dropped").map((it) => itemRow(it, false))));
  } else if (current === LATER) {
    const loose = items().filter((it) => it.later || (it.where === "kept" && themeLater(it.theme)));
    out.push(el("h2", {}, "Later"), ...Object.keys(S.groups).filter((gid) => S.groups[gid].later || themeLater(S.groups[gid].theme)).map(groupCard));
    if (loose.length) out.push(el("h3", {}, `Items on their own (${loose.length})`), el("div", { class: "card" }, ...loose.map((it) => itemRow(it, false))));
  } else if (current === NONE) {
    const groups = Object.keys(S.groups).filter((gid) => S.groups[gid].theme === null);
    const loose = items().filter((it) => alone(it) && it.theme === null);
    out.push(el("h2", {}, "In no theme"));
    const candidates = hints.new.map(candidateCard).filter((c) => c);
    if (candidates.length) out.push(el("h3", {}, `Could be new themes (${candidates.length})`), ...candidates);
    out.push(...groups.map(groupCard));
    if (loose.length) out.push(el("h3", {}, `Items on their own (${loose.length})`), el("div", { class: "card" }, ...loose.map((it) => itemRow(it, false))));
  } else {
    const t = S.themes.find((t) => t.id === current);
    out.push(el("h2", {}, t.name, " ", badge(t.id), t.confirmed ? badge("confirmed", "ok") : null, t.later ? badge("later") : null));
    out.push(el("div", { class: "bar" },
      t.confirmed ? null : btn("Confirm theme", () => send({ op: "confirm", theme: t.id }), "main"),
      btn("Rename", () => { const name = prompt("Theme name:", t.name); if (name) send({ op: "rename", theme: t.id, name }); }),
      btn(t.later ? "Not later" : "Later", () => {
        const open = themeItems(t).filter((it) => it.where === "undecided").length;
        if (t.later || !open || confirm(`Mark the whole theme Later? Its ${open} undecided item${open === 1 ? "" : "s"} will be kept. Move any that do not belong first.`))
          send({ op: "later", theme: t.id, on: !t.later });
      }),
      btn("Drop theme", () => {
        const reason = prompt(`Drop all ${themeSize(t)} items in this theme, the ones inside its ${t.groups.length} groups too? Move any that do not belong first. Why drop them?`);
        if (reason) send({ op: "drop", theme: t.id, reason });
      }),
      btn("Fold into…", () => pickTheme("Fold this theme into which one?", (tid) => { if (tid) send({ op: "fold", into: tid, themes: [t.id] }).then((ok) => { if (ok) { current = tid; render(); } }); }, t.id))));
    out.push(...t.groups.map(groupCard));
    if (t.items.length) out.push(el("h3", {}, `Items on their own (${t.items.length})`), el("div", { class: "card" }, ...themeItems(t).map((it) => itemRow(it, false))));
  }
  main.replaceChildren(...out);
}

function openDialog(...kids) {
  const d = $("#dlg");
  d.replaceChildren(...kids);
  if (!d.open) d.showModal();
  return d;
}

function splitDialog(it) {
  const box = el("textarea", { value: (it.split || [it.text]).join("\n") });
  const save = async () => {
    const parts = box.value.split("\n").map((s) => s.trim()).filter(Boolean);
    if (parts.length < 2) return toast("A split needs at least two lines.");
    const logged = await send({ op: "break", item: it.n, parts });
    if (logged) { justSplit.push(...parts.map((_, k) => `${it.n}.${k + 1}`)); $("#dlg").close(); render(); }
  };
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) save(); });
  openDialog(el("b", {}, "Split #" + it.n), el("div", { class: "hint" }, it.text),
    el("div", { class: "hint" }, "One new item per line. Edit, join or reword lines; nothing is saved until you press Save (Ctrl-Enter)."),
    box, el("div", { class: "bar" }, btn("Save split", save, "main"), btn("Cancel", () => $("#dlg").close())));
  box.focus();
}

function picker(title, options, choose) {
  const input = el("input", { placeholder: "Type to filter, Enter picks the first" });
  const list = el("div", { class: "opts" });
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    list.replaceChildren(...options.filter((o) => !q || o.label.toLowerCase().includes(q)).slice(0, 200).map((o, i) =>
      el("div", { class: "opt" + (i === 0 ? " on" : ""), on: { click: () => { $("#dlg").close(); choose(o.id); } } },
        el("span", { style: "flex:1" }, o.label), el("span", { class: "badge" }, o.note))));
  };
  input.addEventListener("input", draw);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && list.firstChild) list.firstChild.click(); });
  draw();
  openDialog(el("b", {}, title), input, list, el("div", { class: "bar" }, btn("Cancel", () => $("#dlg").close())));
  input.focus();
}

function pickTheme(title, choose, except, member) {
  const options = S.themes.filter((t) => t.id !== except).map((t) => ({ id: t.id, label: t.name, note: `${t.id} · ${themeSize(t)}` }))
    .sort((a, b) => a.label.localeCompare(b.label));
  if (!except) options.unshift({ id: null, label: "(no theme)", note: "" });
  if (member) options.unshift({ id: NEW, label: "(a new theme…)", note: "" });
  picker(title, options, (tid) => {
    if (tid !== NEW) return choose(tid);
    const name = prompt("Name for the new theme:");
    if (name) send({ op: "theme", name, groups: [], items: [], ...member });
  });
}

function pickGroup(it) {
  const options = Object.entries(S.groups).filter(([gid]) => gid !== it.where)
    .map(([gid, g]) => ({ id: gid, label: g.draft || g.name, note: `${gid} · ${g.items.length} · ${themeName(g.theme)}` }));
  options.unshift({ id: null, label: "(a new group of its own)", note: "" });
  picker("Move #" + it.n + " to which group?", options, (gid) => {
    if (gid) return send({ op: "move", item: it.n, group: gid });
    if (it.where !== "undecided") return toast("Pull it out or unkeep it first; a new group takes undecided items.");
    const name = prompt("Name for the new group:", it.text.slice(0, 80));
    if (name) send({ op: "create", name, items: [it.n] });
  });
}

async function similar(it) {
  openDialog(el("b", {}, "Similar to #" + it.n), el("div", { class: "hint" }, "Looking…"));
  const r = await fetch("/api/neighbours?item=" + encodeURIComponent(it.n));
  const j = await r.json();
  if (!r.ok) { $("#dlg").close(); return toast(j.error); }
  openDialog(el("b", {}, "Similar to #" + it.n), el("div", { class: "hint" }, it.text), ...j.nearest_outside.map((nb) => neighbourRow(it, nb)),
    el("div", { class: "bar" }, btn("Close", () => $("#dlg").close())));
}

function neighbourRow(it, nb) {
  const acts = el("div", { class: "acts" });
  if (nb.where in S.groups && nb.where !== it.where)
    acts.append(btn("Same group", () => { $("#dlg").close(); send({ op: "move", item: it.n, group: nb.where }); }, "main"));
  if (nb.theme && nb.theme !== it.theme && it.where !== nb.where && !(it.where in S.groups))
    acts.append(btn("Same theme", () => { $("#dlg").close(); send({ op: "assign", item: it.n, theme: nb.theme }); }));
  return el("div", { class: "row" }, el("span", { class: "n" }, "#" + nb.n),
    el("span", { class: "tx" }, nb.text, badge(nb.where), badge(themeName(nb.theme))), acts);
}

// The list is in the order it was written, so the entries just above and below an item were written around the same time.
function nearby(it) {
  const place = (n) => String(n).split(".").map(Number);
  const inOrder = (a, b) => { const x = place(a.n), y = place(b.n); for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };
  const all = items().sort(inOrder), at = all.indexOf(it);
  openDialog(el("b", {}, "Nearby in the list: #" + it.n),
    el("div", { class: "hint" }, "Written just before (older)"), ...all.slice(Math.max(0, at - NEARBY), at).map((nb) => neighbourRow(it, nb)),
    el("div", { class: "row" }, el("span", { class: "n" }, "#" + it.n), el("span", { class: "tx" }, el("b", {}, it.text))),
    el("div", { class: "hint" }, "Written just after (newer)"), ...all.slice(at + 1, at + 1 + NEARBY).map((nb) => neighbourRow(it, nb)),
    el("div", { class: "bar" }, btn("Close", () => $("#dlg").close())));
}

const undo = () => send({ op: "undo" }).then((ok) => ok && toast("Took back the latest decision."));
$("#undo").addEventListener("click", undo);
$("#save").addEventListener("click", async () => {
  $("#save").disabled = true;
  $("#save").textContent = "Saving…";
  const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  const j = await r.json();
  await load();
  if (!r.ok) toast(j.error);
  else if (!j.pushed) toast("Committed on this laptop, but not pushed: " + j.error);
  else toast("Saved to the private repository.");
});
$("#filter").addEventListener("input", render);
document.addEventListener("keydown", (e) => {
  if ($("#dlg").open || e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (typing) { if (e.key === "Escape") document.activeElement.blur(); return; }
  const rows = sections();
  const i = rows.findIndex((r) => r.id === current);
  if (e.key === "j" && i < rows.length - 1) { current = rows[i + 1].id; render(); $("#main").scrollTop = 0; }
  else if (e.key === "k" && i > 0) { current = rows[i - 1].id; render(); $("#main").scrollTop = 0; }
  else if (e.key === "u") undo();
  else if (e.key === "/") { e.preventDefault(); $("#filter").focus(); }
});
load();
</script>
</body>
</html>
